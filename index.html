<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health Tracker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header><p class="eyebrow">ЛИЧНЫЕ ДАННЫЕ · WHOOP HISTORY</p><h1>Как я сегодня?</h1><p id="selected-date" class="muted"></p></header>
      <section id="summary" class="cards" aria-live="polite"></section>
      <section class="panel"><div class="panel-head"><h2>Календарь</h2><button id="previous" aria-label="Предыдущий месяц">←</button><strong id="month"></strong><button id="next" aria-label="Следующий месяц">→</button></div><div id="calendar" class="calendar"></div></section>
      <section class="grid"><article class="panel"><h2>Сон</h2><div id="sleep"></div></article><article class="panel"><h2>Контекст</h2><div id="context"></div></article></section>
      <p class="footnote">Stress Score — экспериментальный физиологический proxy на основе RHR и HRV относительно предыдущего 14-дневного baseline. Это не медицинский вывод и не показатель WHOOP.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
